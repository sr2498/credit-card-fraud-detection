name: Credit Card Fraud Detection - CI Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  machine-learning-pipeline:

    runs-on: ubuntu-latest

    steps:

    # 1. Checkout repository
    - name: Checkout Repository
      uses: actions/checkout@v4


    # 2. Setup Python environment
    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    # 3. Install dependencies
    - name: Install Required Packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    # 4. Validate Python code
    - name: Check Python Syntax
      run: |
        python -m compileall .


    # 5. Run ML Model Validation
    - name: Run Fraud Detection Model Test
      run: |
        python test_model.py


    # 6. Generate workflow status
    - name: Pipeline Completed
      run: |
        echo "✅ Credit Card Fraud Detection ML Pipeline Completed Successfully"
