name: Credit Card Fraud Detection CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  machine-learning-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "requirements.txt not found"
            exit 1
          fi

      - name: Check Python syntax
        run: |
          python -m compileall -q .

      - name: Run fraud detection model tests
        run: |
          if [ -f test_model.py ]; then
            python test_model.py
          elif [ -d tests ]; then
            python -m pytest -q tests
          else
            echo "No test_model.py or tests folder found"
            exit 1
          fi

      - name: Pipeline completed
        run: |
          echo "Credit Card Fraud Detection ML pipeline completed successfully"
